<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Export Complete - ComicCraft
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>


<body>

<main class="container centered">


    <section class="card success-card">


        <div class="success-icon">

            ✓

        </div>


        <span class="badge">

            EXPORT COMPLETE

        </span>


        <h1>

            Your Comic PDF Is Ready!

        </h1>


        <p>

            Your AI-generated comic has been
            successfully exported.

        </p>


        {% if pdf_url %}

        <a
            class="primary-btn inline-btn"
            href="{{ pdf_url }}"
            download
        >
            Download PDF Again
        </a>

        {% endif %}


        <a
            class="secondary-btn inline-btn"
            href="/"
        >
            Go Create Another Comic
        </a>


    </section>

</main>

</body>

</html>
